<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#667eea">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>📱 محل الموبايلات</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }

html { font-size: 16px; }

body {
background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
min-height: 100vh;
padding: 16px;
color: #333;
-webkit-text-size-adjust: 100%;
overflow-x: hidden;
padding-bottom: 80px;
}

header { text-align: center; color: white; margin-bottom: 20px; }
header h1 { font-size: 1.7rem; margin-bottom: 5px; }
header p { opacity: 0.9; font-size: 0.9rem; }

main {
max-width: 950px;
margin: 0 auto;
background: white;
border-radius: 16px;
padding: 20px;
box-shadow: 0 10px 40px rgba(0,0,0,0.2);
}

.form-section h2 { margin-bottom: 15px; color: #667eea; font-size: 1.2rem; }

.form-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
}
.form-grid input {
padding: 14px;
border: 2px solid #e0e0e0;
border-radius: 10px;
font-size: 16px;
transition: border 0.2s;
font-family: inherit;
width: 100%;
background: #fafafa;
}
.form-grid input:focus { outline: none; border-color: #667eea; background: white; }
.form-grid .full { grid-column: 1 / -1; }

.form-buttons { margin-top: 12px; display: flex; gap: 10px; }
button {
padding: 14px 20px;
border: none;
border-radius: 10px;
font-size: 1rem;
cursor: pointer;
font-weight: bold;
transition: transform 0.15s, opacity 0.2s;
font-family: inherit;
min-height: 48px;
}
button:active { transform: scale(0.97); }
#submit-btn { background: #667eea; color: white; flex: 1; }
#cancel-btn { background: #e0e0e0; color: #333; }

.search-section {
margin: 20px 0 15px;
display: flex;
gap: 10px;
align-items: center;
}
#search {
flex: 1;
padding: 14px;
border: 2px solid #e0e0e0;
border-radius: 10px;
font-size: 16px;
font-family: inherit;
width: 100%;
background: #fafafa;
}
#search:focus { outline: none; border-color: #667eea; background: white; }
#count {
background: #667eea;
color: white;
padding: 8px 14px;
border-radius: 20px;
font-size: 0.85rem;
white-space: nowrap;
}

.stats {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 10px;
margin-bottom: 15px;
}
.stat-card {
background: #f0f3ff;
padding: 12px;
border-radius: 10px;
text-align: center;
}
.stat-card .label { font-size: 0.8rem; color: #666; margin-bottom: 4px; }
.stat-card .value { font-size: 1.1rem; font-weight: bold; color: #667eea; }

#items-list {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
gap: 12px;
}

.item-card {
background: #f8f9ff;
border: 2px solid #e8ecff;
border-radius: 12px;
padding: 15px;
transition: transform 0.15s, box-shadow 0.2s;
}
.item-card h3 { color: #4a5568; margin-bottom: 6px; font-size: 1.05rem; }
.item-card .brand { color: #667eea; font-weight: bold; font-size: 0.9rem; margin-bottom: 8px; }
.item-card .info { font-size: 0.9rem; color: #555; margin: 4px 0; }
.item-card .price { color: #38a169; font-weight: bold; font-size: 1.05rem; }
.item-card .total { color: #667eea; font-weight: bold; font-size: 0.9rem; margin-top: 4px; }
.item-card .desc { font-size: 0.85rem; color: #888; margin-top: 8px; font-style: italic; }
.item-card .actions { display: flex; gap: 8px; margin-top: 12px; }
.item-card .actions button { flex: 1; padding: 10px; font-size: 0.85rem; min-height: 42px; }
.btn-edit { background: #f6ad55; color: white; }
.btn-delete { background: #fc8181; color: white; }

.empty { text-align: center; padding: 40px 20px; color: #999; grid-column: 1 / -1; }
.empty .icon { font-size: 3rem; margin-bottom: 10px; }

.hidden { display: none; }

.save-indicator {
position: fixed;
bottom: 20px;
left: 50%;
transform: translateX(-50%) translateY(100px);
background: #38a169;
color: white;
padding: 12px 24px;
border-radius: 30px;
font-size: 0.9rem;
transition: transform 0.3s;
z-index: 100;
box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}
.save-indicator.show { transform: translateX(-50%) translateY(0); }

.backup-bar {
position: fixed;
bottom: 0;
left: 0;
right: 0;
background: white;
box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
padding: 10px 16px;
display: flex;
gap: 8px;
z-index: 50;
}
.backup-bar button {
flex: 1;
padding: 12px;
font-size: 0.85rem;
min-height: 44px;
}
.btn-export { background: #48bb78; color: white; }
.btn-import { background: #4299e1; color: white; }

@media (max-width: 600px) {
.form-grid { grid-template-columns: 1fr; }
header h1 { font-size: 1.4rem; }
main { padding: 15px; }
body { padding: 12px; padding-bottom: 80px; }
}
</style>

</head>
<body>

<header>
  <h1>📱 محل الموبايلات</h1>
  <p>إدارة أصناف المحل</p>
</header>

<main>
  <section class="form-section">
    <h2 id="form-title">➕ إضافة صنف جديد</h2>
    <form id="item-form" autocomplete="off">
      <div class="form-grid">
        <input type="text" id="name" placeholder="اسم الصنف (مثال: iPhone 13)" required>
        <input type="text" id="brand" placeholder="الماركة (مثال: Apple)" required>
        <input type="number" id="price" placeholder="السعر (جنيه)" required min="0" inputmode="decimal" step="any">
        <input type="number" id="quantity" placeholder="الكمية" required min="0" inputmode="numeric" step="1">
        <input type="text" id="description" placeholder="وصف (اختياري)" class="full">
      </div>
      <div class="form-buttons">
        <button type="submit" id="submit-btn">إضافة الصنف</button>
        <button type="button" id="cancel-btn" class="hidden">إلغاء</button>
      </div>
    </form>
  </section>

  <section class="search-section">
    <input type="text" id="search" placeholder="🔍 ابحث بالاسم أو الماركة...">
    <span id="count">0 صنف</span>
  </section>

  <section class="stats">
    <div class="stat-card">
      <div class="label">📦 عدد الأصناف</div>
      <div class="value" id="stat-items">0</div>
    </div>
    <div class="stat-card">
      <div class="label">💰 إجمالي القيمة</div>
      <div class="value" id="stat-value">0 جنيه</div>
    </div>
  </section>

  <section id="items-list"></section>
</main>

<div class="save-indicator" id="save-indicator">✅ تم الحفظ</div>

<div class="backup-bar">
  <button class="btn-export" id="export-btn">📤 تصدير نسخة</button>
  <button class="btn-import" id="import-btn">📥 استيراد نسخة</button>
  <input type="file" id="import-file" accept=".json" class="hidden">
</div>

<script>
(function () {
  'use strict';

  const STORAGE_KEY = 'mobile_shop_items';

  function loadItems() {
    try {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    } catch (e) {
      return [];
    }
  }

  function saveItems(items) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    showSaveIndicator();
  }

  function showSaveIndicator() {
    const el = document.getElementById('save-indicator');
    el.classList.add('show');
    setTimeout(function () { el.classList.remove('show'); }, 1500);
  }

  let items = loadItems();
  let editingId = null;

  const form = document.getElementById('item-form');
  const formTitle = document.getElementById('form-title');
  const submitBtn = document.getElementById('submit-btn');
  const cancelBtn = document.getElementById('cancel-btn');
  const searchInput = document.getElementById('search');
  const itemsList = document.getElementById('items-list');
  const countEl = document.getElementById('count');
  const nameInput = document.getElementById('name');
  const brandInput = document.getElementById('brand');
  const priceInput = document.getElementById('price');
  const quantityInput = document.getElementById('quantity');
  const descInput = document.getElementById('description');
  const statItems = document.getElementById('stat-items');
  const statValue = document.getElementById('stat-value');

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function formatNum(n) {
    return Number(n).toLocaleString('ar-EG');
  }

  function updateStats() {
    statItems.textContent = items.length;
    const total = items.reduce(function (sum, i) {
      return sum + (Number(i.price) * Number(i.quantity));
    }, 0);
    statValue.textContent = formatNum(total) + ' جنيه';
  }

  function renderItems(filter) {
    filter = filter || '';
    const query = filter.trim().toLowerCase();

    const filtered = items.filter(function (item) {
      return item.name.toLowerCase().indexOf(query) !== -1 ||
             item.brand.toLowerCase().indexOf(query) !== -1;
    });

    countEl.textContent = filtered.length + ' صنف';

    if (filtered.length === 0) {
      itemsList.innerHTML =
        '<div class="empty">' +
          '<div class="icon">📦</div>' +
          '<p>' + (query ? 'مفيش نتائج للبحث' : 'لسه مفيش أصناف. أضف أول صنف!') + '</p>' +
        '</div>';
      updateStats();
      return;
    }

    itemsList.innerHTML = filtered.map(function (item) {
      const total = Number(item.price) * Number(item.quantity);
      return '<div class="item-card">' +
        '<h3>' + escapeHtml(item.name) + '</h3>' +
        '<div class="brand">' + escapeHtml(item.brand) + '</div>' +
        '<div class="info price">💰 ' + formatNum(item.price) + ' جنيه</div>' +
        '<div class="info">📦 الكمية: ' + formatNum(item.quantity) + '</div>' +
        '<div class="total">💵 الإجمالي: ' + formatNum(total) + ' جنيه</div>' +
        (item.description ? '<div class="desc">' + escapeHtml(item.description) + '</div>' : '') +
        '<div class="actions">' +
          '<button class="btn-edit" data-action="edit" data-id="' + item.id + '">✏️ تعديل</button>' +
          '<button class="btn-delete" data-action="delete" data-id="' + item.id + '">🗑️ حذف</button>' +
        '</div>' +
      '</div>';
    }).join('');

    updateStats();
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    const data = {
      name: nameInput.value.trim(),
      brand: brandInput.value.trim(),
      price: Number(priceInput.value),
      quantity: Number(quantityInput.value),
      description: descInput.value.trim()
    };

    if (editingId) {
      items = items.map(function (i) {
        return i.id === editingId ? Object.assign({}, i, data) : i;
      });
      resetForm();
    } else {
      items.push(Object.assign({ id: Date.now() }, data));
    }

    saveItems(items);
    form.reset();
    renderItems(searchInput.value);
    nameInput.focus();
  });

  itemsList.addEventListener('click', function (e) {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;

    const id = Number(btn.getAttribute('data-id'));
    const action = btn.getAttribute('data-action');

    if (action === 'edit') {
      const item = items.find(function (i) { return i.id === id; });
      if (!item) return;

      nameInput.value = item.name;
      brandInput.value = item.brand;
      priceInput.value = item.price;
      quantityInput.value = item.quantity;
      descInput.value = item.description || '';
      editingId = id;

      formTitle.textContent = '✏️ تعديل الصنف';
      submitBtn.textContent = 'حفظ التعديل';
      cancelBtn.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    if (action === 'delete') {
      if (!confirm('متأكد إنك عايز تحذف الصنف ده؟')) return;
      items = items.filter(function (i) { return i.id !== id; });
      saveItems(items);
      renderItems(searchInput.value);
    }
  });

  function resetForm() {
    form.reset();
    editingId = null;
    formTitle.textContent = '➕ إضافة صنف جديد';
    submitBtn.textContent = 'إضافة الصنف';
    cancelBtn.classList.add('hidden');
  }

  cancelBtn.addEventListener('click', resetForm);

  searchInput.addEventListener('input', function (e) {
    renderItems(e.target.value);
  });

  // ===== تصدير نسخة احتياطية =====
  document.getElementById('export-btn').addEventListener('click', function () {
    if (items.length === 0) {
      alert('مفيش أصناف تتصدر');
      return;
    }
    const dataStr = JSON.stringify(items, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const date = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = 'اصناف-المحل-' + date + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showSaveIndicator();
  });

  // ===== استيراد نسخة احتياطية =====
  const importBtn = document.getElementById('import-btn');
  const importFile = document.getElementById('import-file');

  importBtn.addEventListener('click', function () {
    importFile.click();
  });

  importFile.addEventListener('change', function (e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function (event) {
      try {
        const imported = JSON.parse(event.target.result);
        if (!Array.isArray(imported)) throw new Error('ملف غير صالح');

        if (confirm('هيتم استبدال كل الأصناف الحالية بـ ' + imported.length + ' صنف من الملف. متأكد؟')) {
          items = imported;
          saveItems(items);
          renderItems(searchInput.value);
          alert('✅ تم استيراد ' + imported.length + ' صنف بنجاح');
        }
      } catch (err) {
        alert('❌ الملف مش صالح. تأكد إنه ملف نسخة احتياطية من الموقع ده.');
      }
      importFile.value = '';
    };
    reader.readAsText(file);
  });

  // ===== تحسين تجربة لوحة المفاتيح على الموبايل =====
  function setupMobileKeyboardFix() {
    const allInputs = document.querySelectorAll('input[type="text"], input[type="number"]');

    allInputs.forEach(function (input) {
      input.addEventListener('focus', function () {
        // نستنى الكيبورد يفتح بعدين نظبط الـ scroll
        setTimeout(function () {
          input.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 350);
      });
    });
  }

  setupMobileKeyboardFix();

  // ===== التشغيل =====
  renderItems();
})();
</script>

</body>
</html>
